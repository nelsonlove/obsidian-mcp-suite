name: Release the Obsidian plugins

# Cut a release by pushing a tag that exactly matches the manifest version
# (e.g. `git tag 0.1.0 && git push origin 0.1.0`). Obsidian + BRAT require the
# tag to equal the version with no leading "v".
#
# ── TWO PLUGINS SINCE S3c, AND THIS LANE IS A STOPGAP ────────────────────────
#
# The suite split turned one plugin artifact into two: `packages/host` (id
# `vault-mcp`) and `packages/governor` (id `governor`), which version together
# for now. This workflow releases BOTH under one tag, verified against BOTH
# manifests, because a tag that shipped only half of a matched pair would be
# worse than one that shipped neither.
#
# It is NOT the per-plugin release tooling `docs/suite-split-design.md` §9 asks
# for, and pretending otherwise is how that item gets forgotten. What is still
# missing: independent versions per plugin, independent tags, and a story for
# the satellites, which have manifests of their own and are released by hand.
# Named as an open item in `docs/s3c-migration-plan.md` §9.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required: the repo's test script uses a glob
          # (node --test 'tests/*.test.mjs'), which the runner only expands on
          # Node >= 21. Also matches the project's @types/node (^22).
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches BOTH manifests
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          for pkg in host governor; do
            v="$(node -p "require('./packages/$pkg/manifest.json').version")"
            if [ "$tag" != "$v" ]; then
              echo "::error::Tag '$tag' does not match packages/$pkg manifest version '$v'."
              exit 1
            fi
          done

      - name: Test
        run: npm test

      - name: Build both plugins
        run: |
          npm run build --workspace=packages/host
          npm run build --workspace=packages/governor

      - name: Create release with both plugins' assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Obsidian/BRAT require manifest.json + main.js as individual assets
          # (never zipped), and BRAT resolves a plugin by its manifest id — so
          # two plugins on one release need distinct asset NAMES. The files are
          # uploaded under `<id>-manifest.json` / `<id>-main.js`; a manual
          # install renames them back, and the release notes say so.
          assets=""
          for pkg in host governor; do
            id="$(node -p "require('./packages/$pkg/manifest.json').id")"
            cp "packages/$pkg/manifest.json" "$RUNNER_TEMP/$id-manifest.json"
            cp "packages/$pkg/main.js" "$RUNNER_TEMP/$id-main.js"
            assets="$assets $RUNNER_TEMP/$id-manifest.json $RUNNER_TEMP/$id-main.js"
            if [ -f "packages/$pkg/styles.css" ]; then
              cp "packages/$pkg/styles.css" "$RUNNER_TEMP/$id-styles.css"
              assets="$assets $RUNNER_TEMP/$id-styles.css"
            fi
          done
          gh release create "$tag" \
            --title "$tag" \
            --notes "Release $tag — two plugins: \`vault-mcp\` (the MCP host) and \`governor\` (the governance provider). Install the host first. Assets are prefixed by plugin id; rename \`<id>-manifest.json\` to \`manifest.json\` and \`<id>-main.js\` to \`main.js\` inside each plugin folder. See docs/s3c-migration-plan.md if you are upgrading from 0.18.x." \
            $assets

  # Publish the vault-mcp-api SDK (packages/vault-mcp-api) to npm when the
  # version in its package.json is not on the registry yet. Independent of the
  # plugin release above: it runs after it, but a skip here never blocks the
  # plugin assets. Requires the NPM_TOKEN secret — when the secret is absent
  # the job SKIPS cleanly (no failure), so releases work before npm publishing
  # is set up.
  publish-sdk:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Decide whether to publish
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not configured — skipping vault-mcp-api npm publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="$(node -p "require('./packages/vault-mcp-api/package.json').name")"
          version="$(node -p "require('./packages/vault-mcp-api/package.json').version")"
          # Distinguish "not published" (E404 ⇒ publish) from a transient
          # registry/network failure (fail loudly rather than attempting a
          # publish that may conflict).
          if out="$(npm view "$name@$version" version 2>&1)"; then
            echo "::notice::$name@$version is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "E404"; then
            echo "::notice::$name@$version is not on npm yet — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed for $name@$version: $out"
            exit 1
          fi

      - name: Install dependencies
        if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - name: Publish vault-mcp-api to npm
        if: steps.gate.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace packages/vault-mcp-api --access public
